<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="experience" class="experience">
      <section id="message-stage" class="message-stage" aria-live="polite">
        <p id="main-message" class="main-message"></p>
      </section>

      <section id="countdown" class="countdown" hidden>
        <div class="countdown-unit">
          <span id="days" class="countdown-value">00</span>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-unit">
          <span id="hours" class="countdown-value">00</span>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-unit">
          <span id="minutes" class="countdown-value">00</span>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-unit">
          <span id="seconds" class="countdown-value">00</span>
          <span class="countdown-label">Seconds</span>
        </div>
      </section>

      <p id="unlocked-placeholder" class="unlocked-placeholder" hidden></p>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
